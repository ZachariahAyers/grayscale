name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the toolchain, components and wasm target named in rust-toolchain.toml.
      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Format
        run: cargo fmt --check

      - name: Clippy (host and wasm)
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --target wasm32-unknown-unknown -- -D warnings

      - name: Rust tests
        run: cargo test

      - name: WebAssembly tests
        run: npx wasm-pack test --node --test wasm

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

  demo:
    needs: check
    if: github.event_name == 'push'
    concurrency:
      group: demo
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Installs the toolchain and wasm target named in rust-toolchain.toml.
      - run: rustup toolchain install

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::993011736775:role/gh-deploy-opensource-grayscale
          aws-region: us-east-1

      - name: Publish to ayers.repair/opensource/grayscale/
        run: |
          aws s3 sync dist/ s3://ayers-repair-site-993011736775/opensource/grayscale/ \
            --delete --cache-control "public, max-age=300" --only-show-errors
          aws cloudfront create-invalidation --distribution-id E1CZIGG4O8R7UI \
            --paths "/opensource/grayscale/*" --query Invalidation.Id --output text
