[package]
name = "grayscale"
version = "2.0.0"
edition = "2024"
description = "Grayscale kernel for 8-bit RGBA pixels, compiled to WebAssembly."
license = "Apache-2.0"
repository = "https://github.com/ZachariahAyers/grayscale"
publish = false

[lib]
# cdylib is the WebAssembly module; rlib lets the integration tests link the crate.
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.129"

[dev-dependencies]
wasm-bindgen-test = "0.3.79"

[profile.release]
lto = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
